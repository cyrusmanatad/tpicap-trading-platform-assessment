events {}

http {

    log_format upstreamlog
        '$server_name to: $upstream_addr [$request] '
        'upstream_response_time $upstream_response_time '
        'msec $msec '
        'request_time $request_time';

    access_log /var/log/nginx/access.log upstreamlog;


    upstream trading_backend {

        server backend-1:3000;
        # server backend-2:3000;
        # server backend-3:3000;

    }

    server {

        listen 80;
        server_name trading-app.cyrusmanatad.com www.trading-app.cyrusmanatad.com;

        return 301 https://$host$request_uri;
    }


    server {

        listen 443 ssl;
        http2 on;
        server_name trading-app.cyrusmanatad.com www.trading-app.cyrusmanatad.com;

        ssl_certificate /etc/nginx/ssl/trading-app.cyrusmanatad.com.cert;
        ssl_certificate_key /etc/nginx/ssl/trading-app.cyrusmanatad.com.key;

        location /api/ {

            proxy_pass http://trading_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }


        location /socket.io/ {

            proxy_pass http://trading_backend;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }


        location / {

            proxy_pass http://frontend:80;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }
}