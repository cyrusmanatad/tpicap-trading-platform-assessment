name: Deploy Production

on:
  release:
    types:
      - published

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OVH
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://trading-app.cyrusmanatad.com

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add OVH host to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release to OVH
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e

            cd /opt/trading-app

            echo "======================================"
            echo "Deploying release: ${RELEASE_TAG}"
            echo "======================================"

            echo "Fetching release tag..."
            git fetch origin tag "${RELEASE_TAG}"

            echo "Checking out release..."
            git checkout --force "${RELEASE_TAG}"

            echo "Building production containers..."
            docker compose -f docker-compose.prod.yml build

            echo "Starting production containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Deployment complete."

            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps

            echo "Deployed version:"
            git describe --tags --exact-match
          EOF
