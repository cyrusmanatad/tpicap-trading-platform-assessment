services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading_app']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend-1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: trading_app
      PORT: 3000
    expose:
      - 3000
    # ports:
    #   - '3000:3000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - trading-network

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend-2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: trading_app
      PORT: 3000
    expose:
      - 3000
    # ports:
    #   - '3000:3000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - trading-network

  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend-3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: trading_app
      PORT: 3000
    expose:
      - 3000
    # ports:
    #   - '3000:3000'
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - trading-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    # depends_on:
    #   - backend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trading-network

  nginx:
    image: nginx:alpine
    container_name: trading-nginx
    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
